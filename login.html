<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            font-family: Montserrat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

            background: url("images/background.png") ;
            margin: 0;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background: rgba(10, 10, 20, 0.6); 

            z-index: 1;
        }

        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;

            position: relative;
            z-index: 1;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box; 
            display: block;

        }

        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .toggle {
            margin-top: 10px;
            cursor: pointer;
            color: blue;
        }
    </style>
</head>
<body>

<div class="auth-container">

    <h2 id="form-title">Login</h2>

    <form id="auth-form">

        <input type="text" id="firstName" placeholder="First Name" class="hidden">
        <input type="text" id="lastName" placeholder="Last Name" class="hidden">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email (for signup)" class="hidden">
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Submit</button>
    </form>

    <p class="toggle" onclick="toggleForm()">Don't have an account? Sign Up</p>

</div>

<script>
let isLogin = true;

function toggleForm() {
    isLogin = !isLogin;

    document.getElementById("form-title").innerText = isLogin ? "Login" : "Sign Up";

    // better toggle (no inline styles)
    document.getElementById("firstName").classList.toggle("hidden", isLogin);
    document.getElementById("lastName").classList.toggle("hidden", isLogin);
    document.getElementById("email").classList.toggle("hidden", isLogin);

    document.querySelector(".toggle").innerText =
        isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login";
}

document.getElementById("auth-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    let firstName = document.getElementById("firstName").value;
    let lastName = document.getElementById("lastName").value;
    let username = document.getElementById("username").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    const url = isLogin 
        ? "http://localhost:3000/login"
        : "http://localhost:3000/signup";

    try {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                email,
                password,
                firstName,
                lastName
            })
        });

        const data = await response.json();

        alert(data.message);

        // if login works → save session
        if (data.message === "Login successful") {
            localStorage.setItem("currentUser", data.user);

            // redirect
            window.location.href = "index.html";
        }

        if (data.message === "User created successfully") {
        localStorage.setItem("currentUser", username);
        window.location.href = "index.html";
        }

    } catch (error) {
        console.error(error);
        alert("Server error. Make sure backend is running.");
    }
});
</script>

</body>
</html>
